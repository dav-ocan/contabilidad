<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Desarrollo gastos{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-size: 14px; }
        .container { height: 100vh; height: 100dvh; width: 100%; max-width: 100%; padding: 0; margin: 0; display: flex; flex-direction: column; }
        .row { height: 100%; width: 100%; margin: 0; flex: 1; display: flex; }
        .col-lg-8, .col-md-10 { height: 100%; width: 100%; max-width: 100%; padding: 0; display: flex; flex-direction: column; }
        .form-container { background: white; height: 100vh; height: 100dvh; width: 100%; display: flex; flex-direction: column; padding: 0; margin: 0; overflow: hidden; }
        .form-header { text-align: center; padding: 20px 15px 15px; border-bottom: 2px solid #667eea; background: white; position: sticky; top: 0; z-index: 10; }
        .form-header h2 { color: #667eea; font-weight: 700; margin-bottom: 5px; font-size: 1.5rem; }
        .form-header p { color: #6c757d; margin: 0; font-size: 0.85rem; }
        .form-content, .content-body { flex: 1; overflow-y: auto; padding: 20px 15px calc(20px + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; }
        .form-label { font-weight: 600; color: #333; margin-bottom: 8px; font-size: 0.9rem; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; padding: 14px 30px; font-weight: 600; border-radius: 8px; transition: transform 0.2s; width: 100%; font-size: 1rem; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .form-control, .form-select { border-radius: 8px; border: 2px solid #e9ecef; padding: 12px 15px; font-size: 0.95rem; }
        .form-control:focus, .form-select:focus { border-color: #667eea; box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25); }
        .alert { border-radius: 8px; border: none; font-size: 0.9rem; }
        .mb-4 { margin-bottom: 1.5rem !important; }
        .content-actions { margin-bottom: 12px; }
        .btn-back { color: #667eea; font-weight: 600; text-decoration: none; }
        .btn-back:hover { text-decoration: underline; }
        .content-title { color: #264591; font-weight: 700; margin-bottom: 6px; }
        .content-subtitle { color: #6c757d; margin-bottom: 20px; }
        .form-actions { margin-top: 10px; }
        .content-body.no-card { padding: 0; }

        @media (min-width: 768px) {
            body { font-size: 16px; }
            .container { padding: 20px; }
            .col-md-10 { max-width: 100%; padding: 0 15px; }
            .form-container { border-radius: 15px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); height: calc(100vh - 40px); height: calc(100dvh - 40px); }
            .form-header h2 { font-size: 2rem; }
            .form-content, .content-body { padding: 30px 40px calc(20px + env(safe-area-inset-bottom, 0px)); }
        }
        @media (min-width: 992px) {
            .col-lg-8 { max-width: 900px; margin: 0 auto; }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="form-container">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.all.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    {% if messages %}
    <script>
        (function() {
            const msgs = [
                {% for message in messages %}
                {level: "{{ message.tags|default:'info' }}", text: "{{ message|escapejs }}"},
                {% endfor %}
            ];
            msgs.forEach(msg => {
                const icon = msg.level.includes('error') ? 'error' :
                             msg.level.includes('warning') ? 'warning' :
                             msg.level.includes('success') ? 'success' : 'info';
                Swal.fire({icon, title: msg.text});
            });
        })();
    </script>
    {% endif %}

    {% block extra_js %}{% endblock %}
</body>
</html>
